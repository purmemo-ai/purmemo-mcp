name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Token-free publish via npm Trusted Publishing (GitHub OIDC), chosen by
      # Chris 2026-09-13 after the NPM_TOKEN granular token silently expired
      # (npm caps them at 90 days; the 2026-05-21 token died ~08-19 and the
      # v15.7.27 publish failed with a 404-on-PUT). Requirements: the package's
      # Trusted Publisher on npmjs.com = GitHub Actions, org purmemo-ai, repo
      # purmemo-mcp, workflow publish.yml; `id-token: write` above; npm >= 11.5.1
      # (node 20 ships npm 10, hence the upgrade). No NPM_TOKEN secret anywhere.
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Publish to npm (trusted publishing, no token)
        run: npm publish --provenance --access public

      - name: Build .mcpb bundle (with dependencies)
        run: |
          # Install bundle server dependencies (gitignored, so missing in CI)
          cd bundle/server && npm ci && cd ../..
          # Build the .mcpb (syncs version, copies source, zips)
          node scripts/build-mcpb.js

      - name: Upload .mcpb to GitHub Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./purmemo-mcp.mcpb
          asset_name: purmemo-mcp.mcpb
          asset_content_type: application/octet-stream

      # Remote MCP redeploy: NOT here. The remote endpoint (mcp.purmemo.ai)
      # lives on the polymathematics OCI VM and auto-deploys on every push to
      # main via deploy-polymathematics.yml — the version-bump push that
      # precedes a release has already triggered it. The old Render service
      # (purmemo-mcp.onrender.com) was suspended by Chris 2026-06-18; the curl
      # step that redeployed it was removed 2026-07-18.
