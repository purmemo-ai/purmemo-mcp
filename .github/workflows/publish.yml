name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # npm >= 11.5.1 can publish via GitHub OIDC ("trusted publishing") with no
      # token at all. Node 20 ships npm 10, so upgrade first. If NPM_TOKEN is set
      # it is still used (granular tokens expire after at most 90 days — the
      # 2026-09-13 release failed with a 404-on-PUT because the 2026-05-21 token
      # had expired). Once the package's Trusted Publisher is configured on
      # npmjs.com for this repo + workflow, delete the NPM_TOKEN secret and the
      # publish runs token-free forever.
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build .mcpb bundle (with dependencies)
        run: |
          # Install bundle server dependencies (gitignored, so missing in CI)
          cd bundle/server && npm ci && cd ../..
          # Build the .mcpb (syncs version, copies source, zips)
          node scripts/build-mcpb.js

      - name: Upload .mcpb to GitHub Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./purmemo-mcp.mcpb
          asset_name: purmemo-mcp.mcpb
          asset_content_type: application/octet-stream

      # Remote MCP redeploy: NOT here. The remote endpoint (mcp.purmemo.ai)
      # lives on the polymathematics OCI VM and auto-deploys on every push to
      # main via deploy-polymathematics.yml — the version-bump push that
      # precedes a release has already triggered it. The old Render service
      # (purmemo-mcp.onrender.com) was suspended by Chris 2026-06-18; the curl
      # step that redeployed it was removed 2026-07-18.
